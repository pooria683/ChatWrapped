[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatwrapped"
version = "0.1.0"
description = "Spotify Wrapped for your AI chats — turn ChatGPT / Claude / Gemini data exports into a shareable year-in-review. 100% local, zero network calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChatWrapped contributors" }]
keywords = ["chatgpt", "claude", "gemini", "wrapped", "spotify-wrapped", "data-export", "local-first", "cli", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Jinja2 is an optional templating extra; the tool falls back to string.Template
# and runs with zero dependencies.
jinja = ["Jinja2>=3.1"]
test = ["pytest>=7"]

[project.scripts]
chatwrapped = "chatwrapped.cli:main"

[project.urls]
Homepage = "https://github.com/pooria683/ChatWrapped"
Repository = "https://github.com/pooria683/ChatWrapped"
Issues = "https://github.com/pooria683/ChatWrapped/issues"

[tool.setuptools.packages.find]
include = ["chatwrapped*"]

[tool.setuptools.package-data]
chatwrapped = ["rates.json", "render/wrapped_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
